<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Cybersecurity RAG Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 600;
    }

    #controls {
      max-width: 900px;
      margin: 10px auto;
      padding: 0 20px;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .user {
      font-weight: 600;
    }

    .bot {
      border-left: 4px solid #2563eb;
      padding-left: 12px;
    }

    .sources {
      margin-top: 6px;
      font-size: 12px;
      color: #555;
    }

    footer {
      border-top: 1px solid #e5e7eb;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #clear-btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #374151;
      color: white;
      cursor: pointer;
    }

    #clear-btn:hover {
      background: #4b5563;
    }
  </style>
</head>

<body>
  <header>RAG chatbot for The NIST Cybersecurity Framework 2.0 </header>

  <div id="controls">
    <label>
      <input type="checkbox" id="rag-toggle" checked />
      Use Retrieval-Augmented Generation (RAG)
    </label>
  </div>

  <div id="chat"></div>

  <footer>
    <input id="input" type="text" placeholder="Ask a cybersecurity question..." />
    <button id="send">Send</button>
    <button id="clear-btn" type="button">Clear</button>
  </footer>

  <script>
    const API_URL = "http://127.0.0.1:8000/chat";
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const ragToggle = document.getElementById("rag-toggle");
    const clearBtn = document.getElementById("clear-btn");


    function addMessage(text, cls, sources = []) {
      const div = document.createElement("div");
      div.className = "message " + cls;
      div.textContent = text;

      if (sources.length > 0) {
        const s = document.createElement("div");
        s.className = "sources";
        s.textContent = "Sources: " + sources.join(", ");
        div.appendChild(s);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }


    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage("You: " + text, "user");
      input.value = "";

      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text,
          use_rag: ragToggle.checked
        })
      });

      const data = await res.json();
      addMessage(data.answer, "bot", data.sources || []);
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    addMessage(
      "Hello 👋 I can answer questions with or without RAG. Use the checkbox to compare.",
      "bot"
    );
    clearBtn.addEventListener("click", () => {
      chat.innerHTML = "";

      // Optional: re-add welcome message
      addMessage(
        "Hello 👋 I can answer questions with or without RAG. Use the checkbox to compare.",
        "bot"
      );
    });
  </script>
</body>

</html>
