<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Cybersecurity RAG Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 600;
    }

    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* LEFT SIDEBAR */
    #controls {
      width: 260px;
      padding: 20px;
      border-right: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: 14px;
      box-sizing: border-box;
    }

    /* RIGHT SIDE (CHAT + INPUT) */
    #chat-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .user {
      font-weight: 600;
    }

    .bot {
      border-left: 4px solid #2563eb;
      padding-left: 12px;
    }

    .sources {
      margin-top: 6px;
      font-size: 12px;
      color: #555;
    }

    footer {
      border-top: 1px solid #e5e7eb;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      background: #ffffff;
      box-sizing: border-box;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      min-width: 0;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #clear-btn {
      background: #374151;
    }

    #clear-btn:hover {
      background: #4b5563;
    }

    input[type="range"] {
      width: 100%;
    }
  </style>
</head>

<body>
  <header>RAG Chatbot for the NIST Cybersecurity Framework 2.0</header>

  <div id="layout">

    <!-- LEFT CONTROLS -->
    <aside id="controls">
      <strong>RAG Controls</strong><br><br>

      <label>
        <input type="checkbox" id="rag-toggle" checked />
        Enable Retrieval (RAG)
      </label>

      <br><br>

      <label>
        Top-K Value: <strong><span id="k-value">5</span></strong>
        <input type="range" id="k-slider" min="1" max="10" value="5" />
      </label>

      <br><br>

      <label>
         Threshold value: <strong><span id="t-value">0.75</span></strong>
        <input type="range" id="t-slider" min="0.3" max="0.9" step="0.05" value="0.75" />
      </label>
    </aside>

    <!-- RIGHT CHAT AREA -->
    <div id="chat-wrapper">
      <main id="chat"></main>

      <footer>
        <input id="input" type="text" placeholder="Ask a cybersecurity question..." />
        <button id="send">Send</button>
        <button id="clear-btn" type="button">Clear</button>
      </footer>
    </div>

  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/chat";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear-btn");
    const ragToggle = document.getElementById("rag-toggle");
    const kSlider = document.getElementById("k-slider");
    const tSlider = document.getElementById("t-slider");
    const kValue = document.getElementById("k-value");
    const tValue = document.getElementById("t-value");

    kSlider.oninput = () => (kValue.textContent = kSlider.value);
    tSlider.oninput = () => (tValue.textContent = tSlider.value);

    function addMessage(text, cls, sources = []) {
      const div = document.createElement("div");
      div.className = "message " + cls;
      div.textContent = text;

      if (sources.length > 0) {
        const s = document.createElement("div");
        s.className = "sources";
        s.textContent = "Sources: " + sources.join(", ");
        div.appendChild(s);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage("You: " + text, "user");
      input.value = "";

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          use_rag: ragToggle.checked,
          top_k: parseInt(kSlider.value),
          threshold: parseFloat(tSlider.value)
        })
      });

      const data = await res.json();
      addMessage(data.answer, "bot", data.sources || []);
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    clearBtn.onclick = () => {
      chat.innerHTML = "";
      addMessage(
        "Hello 👋 I can answer questions with or without RAG. Use the controls on the left to experiment.",
        "bot"
      );
    };

    addMessage(
      "Hello 👋 I can answer questions with or without RAG. Use the controls on the left to experiment.",
      "bot"
    );
  </script>
</body>

</html>
